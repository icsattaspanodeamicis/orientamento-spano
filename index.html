<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incontri di orientamento</title>
<style>
:root {
  color-scheme: light;
  --bg: #F1F5F5;
  --surface: #FFFFFF;
  --ink: #14262B;
  --muted: #586D73;
  --line: #D3DDDF;
  --accent: #0A6C74;
  --on-accent: #FFFFFF;
  --accent-soft: #DDEFF0;
  --taken: #E6ECEE;
  --warn: #8A5A00;
  --danger: #B3261E;
  --scrim: rgba(8, 20, 24, 0.5);
  --f-display: "Familjen Grotesk", "Hanken Grotesk", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0D1A1D;
    --surface: #14262A;
    --ink: #E4EEF0;
    --muted: #8CA3A9;
    --line: #27393F;
    --accent: #4DC0C8;
    --on-accent: #062428;
    --accent-soft: #13373B;
    --taken: #1C3237;
    --warn: #E3B35C;
    --danger: #F2867F;
    --scrim: rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.wrap { max-width: 62rem; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(1.9rem, 5vw, 2.6rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
}
.eyebrow { margin: 0 0 8px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); }
.lead { margin: 8px 0 0; color: var(--muted); max-width: 42rem; }

.btn {
  appearance: none;
  font: inherit;
  font-weight: 600;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.5rem 0.9rem;
  min-height: 2.5rem;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover:not(:disabled) { color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 1rem 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card h2 { font-family: var(--f-display); font-size: 1.3rem; margin: 0; }
.card p { margin: 0; }
.card[hidden], .note[hidden] { display: none; }
.note { margin: 0; padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--surface); }

.days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dayhead { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.dayhead .dn { font-size: 0.74rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.dayhead .dd { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; }
.dayhead .mm { color: var(--muted); }
.turn {
  appearance: none;
  font: inherit;
  text-align: left;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  width: 100%;
  min-height: 3.4rem;
  padding: 0.6rem 0.8rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.turn .time { font-family: var(--f-mono); font-weight: 500; font-size: 1rem; }
.pill { font-size: 0.8rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.turn.last .pill { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.turn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.turn:disabled { cursor: default; background: var(--taken); color: var(--muted); }
.turn:disabled .pill { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.turn.loading { opacity: 0.45; }
.foot { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 46rem; }

.overlay { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; }
.overlay[hidden] { display: none; }
.sheet {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: min(100%, 30rem);
  max-height: 100%;
  overflow: auto;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sheet h2 { font-family: var(--f-display); font-size: 1.4rem; margin: 0; }
.sheet-sub { margin: 2px 0 0; color: var(--muted); }
.sheet-sub .t { font-family: var(--f-mono); font-size: 0.85em; }
.hint { margin: 0; padding: 0.55rem 0.7rem; border-radius: 8px; background: var(--accent-soft); font-size: 0.88rem; }
.form { display: flex; flex-direction: column; gap: 14px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 0.82rem; font-weight: 600; }
.field .opt { font-weight: 400; color: var(--muted); }
.field input[type="text"], .field input[type="email"], .field input[type="tel"], .field input[type="number"], .field textarea {
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.6rem 0.7rem;
  min-width: 0;
  width: 100%;
}
.field textarea { resize: vertical; min-height: 4.2rem; }
.field input:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; }
.consent input { margin-top: 0.2rem; width: 1.1rem; height: 1.1rem; flex: none; }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.err { margin: 0; color: var(--danger); font-weight: 500; }
.err[hidden] { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: 0.85rem; }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.prog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.prog li { display: flex; justify-content: space-between; gap: 12px; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; }
.prog .o { font-family: var(--f-mono); }
.prog .c { font-weight: 700; font-family: var(--f-display); }

@media (max-width: 760px) {
  .days { grid-template-columns: minmax(0, 1fr); }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .overlay { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 14px 14px 0 0; width: 100%; padding-bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: no-preference) {
  .turn, .btn { transition: background-color 0.12s, border-color 0.12s, color 0.12s; }
}

/* Restyling: layout istituzionale, chiaro e responsive */
:root { color-scheme:light; --bg:#F5F8F8; --surface:#fff; --ink:#14262B; --muted:#61757C; --line:#DCE5E7; --accent:#0A6C74; --on-accent:#fff; --accent-soft:#E8F4F4; --taken:#F3F5F6; --warn:#8A5A00; --danger:#B3261E; --scrim:rgba(8,20,24,.5); --f-body:system-ui,-apple-system,"Segoe UI",sans-serif; --f-display:var(--f-body); --f-mono:var(--f-body); }
body { padding:0 24px 32px; font-size:16px; line-height:1.5; }
.wrap { max-width:1180px; gap:28px; }
.brandbar { display:flex; align-items:center; gap:16px; padding:22px 0; border-bottom:1px solid var(--line); }
.brand-icon { width:46px; height:46px; flex:none; color:var(--ink); }
.brand-name { font-size:18px; font-weight:700; }
.brand-sub { color:var(--muted); font-size:15px; }
.brand-year { margin-left:auto; color:var(--muted); white-space:nowrap; }
.hero { padding-top:12px; }
h1 { font-size:clamp(2rem,4vw,3rem); line-height:1.13; letter-spacing:-.035em; }
.subtitle { margin:8px 0 12px; font-size:clamp(1.15rem,2.5vw,1.75rem); line-height:1.3; }
.lead { margin:0; max-width:55rem; font-size:17px; }
.info-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); padding:20px 12px; border:1px solid var(--line); border-radius:12px; gap:12px; }
.info-item { display:flex; align-items:center; justify-content:center; gap:12px; padding:0 12px; }
.info-item + .info-item { border-left:1px solid var(--line); }
.info-item svg { width:26px; height:26px; flex:none; }
.section-heading { margin:0 0 16px; font-size:24px; letter-spacing:-.025em; }
.days { gap:18px; }
.day { padding:22px; border-radius:14px; gap:0; }
.dayhead { display:block; padding:0 0 16px; border:0; }
.dayhead .dn { display:block; font-size:12px; font-weight:600; margin-bottom:6px; }
.date-line { display:block; font-size:25px; font-weight:700; line-height:1.25; letter-spacing:-.025em; }
.dayhead .dd,.dayhead .mm { font:inherit; color:var(--ink); }
.turn { min-height:91px; flex-wrap:nowrap; border:0; border-radius:0; padding:16px 0; gap:10px; }
.turn + .turn { border-top:1px solid var(--line); }
.slot-info { display:flex; flex-direction:column; min-width:0; gap:3px; }
.turn .time { font-family:var(--f-body); font-variant-numeric:tabular-nums; font-size:17px; font-weight:650; white-space:nowrap; }
.pill { padding:0; border:0; background:transparent; font-size:13px; font-weight:500; border-radius:0; }
.turn.last .pill { border:0; color:var(--warn); }
.slot-action { flex:none; display:flex; align-items:center; justify-content:center; gap:8px; background:var(--accent); color:#fff; padding:10px 13px; border-radius:7px; font-size:14px; font-weight:600; min-height:44px; }
.turn:hover:not(:disabled) { background:var(--accent-soft); box-shadow:0 0 0 8px var(--accent-soft); border-radius:5px; }
.turn:disabled { background:transparent; color:var(--muted); }
.turn:disabled .pill { border:0; }
.turn:disabled .slot-action { background:#E9EEF0; color:#617078; }
.turn.loading { min-height:91px; background:linear-gradient(90deg,#f1f5f5,#e9eeee,#f1f5f5); margin:6px 0; border-radius:6px; }
.footer-note { display:flex; align-items:flex-start; gap:14px; }
.footer-note svg { width:25px; height:25px; flex:none; color:var(--muted); }
.foot { font-size:14px; max-width:60rem; }
.place { display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; margin:14px 0 0; font-size:16px; }
.place[hidden] { display:none; }
.place svg { width:22px; height:22px; flex:none; color:var(--accent); }
.place a { color:var(--accent); font-weight:600; }
.facts a { color:var(--accent); }
.site-footer { border-top:1px solid var(--line); padding-top:18px; text-align:center; color:var(--muted); font-size:12px; }
.sheet { position:relative; width:min(100%,680px); padding:28px; gap:20px; border-radius:16px; }
.sheet h2 { padding-right:40px; font-size:24px; }
.sheet-close { position:absolute; top:16px; right:16px; width:40px; height:40px; padding:0; display:grid; place-items:center; font-size:24px; background:var(--surface); }
.sheet-sub { font-size:14px; }
.form { gap:18px; }
.form-group { margin:0; padding:0; border:0; min-width:0; display:flex; flex-direction:column; gap:12px; }
.form-group legend { padding:0 0 10px; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.04em; text-transform:uppercase; }
.field label { font-size:14px; }
.field input,.field textarea { min-height:44px; }
.field textarea { min-height:70px; }
.actions { padding-top:4px; }
.btn { min-height:44px; }
.hint { color:var(--ink); padding:12px 14px; }
.note.error { border-left-color:var(--danger); }
@media (max-width:1050px) and (min-width:761px) { .day{padding:16px;} .turn{flex-wrap:wrap;} .slot-action{margin-top:3px;} }
@media (max-width:760px) {
 body{padding:0 18px 24px;} .wrap{gap:24px;} .brandbar{padding:18px 0;gap:10px;align-items:flex-start;} .brand-icon{width:34px;height:34px;} .brand-name{font-size:14px;} .brand-sub,.brand-year{font-size:12px;} .brand-year{max-width:65px;white-space:normal;text-align:right;} .hero{padding-top:0;}
 .lead{font-size:15px;} .info-strip{grid-template-columns:1fr;gap:14px;padding:16px;} .info-item{justify-content:flex-start;padding:0;font-size:14px;} .info-item + .info-item{border:0;} .info-item svg{width:22px;height:22px;}
 .day{padding:20px;} .sheet{padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;max-height:94dvh;} .sheet h2{font-size:22px;} .actions{position:sticky;bottom:-24px;background:var(--surface);padding:14px 0 4px;border-top:1px solid var(--line);}
}
@media (max-width:360px) { .turn{flex-wrap:wrap;} .turn .time{font-size:16px;} .slot-action{padding:10px;} }


.brandbar { align-items:center; }
.brand-logo { width:80px; height:80px; object-fit:contain; flex:none; display:block; }
@media (max-width:760px) { .brand-logo { width:64px; height:64px; } .brandbar { gap:12px; } }
@media (max-width:360px) { .brand-logo { width:56px; height:56px; } .brand-year { font-size:11px; } }
</style>

  }
  var FAIL = "Non è stato possibile completare l'operazione. Controlla la connessione e riprova.";

  els.lead.textContent = "Scegli un turno per presentare la tua scuola alle nostre classi terze.";
  $("brand-year").textContent = "A.S. " + CONFIG.anno;
  if (CONFIG.indirizzo) {
    $("place-text").textContent = "Plesso Spano, " + CONFIG.indirizzo;
    $("place-map").href = CONFIG.mappa;
    $("place").hidden = false;
    $("site-footer").textContent = "I.C. Satta Spano De Amicis · Plesso Spano · " + CONFIG.indirizzo;
  }
  $("info-classi").textContent = "Classi " + classiTesto;
  $("info-minuti").textContent = CONFIG.minuti + " minuti per classe";
  els.foot.textContent = "Il posto viene assegnato in automatico al momento della prenotazione e riceverai per email il programma con l'ordine delle classi. Ogni scuola può prenotare un solo turno.";

  function render() {
    els.days.replaceChildren();
    els.days.setAttribute("aria-busy", String(state === "loading"));
    els.note.hidden = state === "ready";
    els.note.classList.toggle("error", state === "error");
    els.note.textContent = state === "error"
      ? "Non riesco a caricare i turni. Ricarica la pagina tra qualche istante."
      : "Caricamento dei turni disponibili in corso…";
    var giorni = state === "ready" ? data.giorni : [1, 2, 3].map(function () { return null; });
    giorni.forEach(function (g) {
      var day = el("section", "day");
      var head = el("div", "dayhead");
      if (g) {
        var d = parse(g.data);
        var dateLine = el("span", "date-line", d.getDate() + " " + NOMI_MESE[d.getMonth()]);
        head.append(el("span", "dn", NOMI_GIORNO[d.getDay()]), dateLine);
      } else {
        head.append(el("span", "dd", "…"));
      }
      day.append(head);
      var turni = g ? g.turni : [1, 2, 3].map(function () { return null; });
      turni.forEach(function (t) {
        var b = el("button", "turn" + (t ? "" : " loading"));
        b.type = "button";
        if (!t) { b.disabled = true; day.append(b); return; }
        var label = t.inizio + "–" + t.fine;
        var full = t.liberi <= 0;
        var slotInfo = el("span", "slot-info");
        slotInfo.append(el("span", "time", label));
        var txt = g.chiuso ? "Chiuso" : full ? "Completo" : t.liberi === 1 ? "1 posto libero" : t.liberi + " posti liberi";
        slotInfo.append(el("span", "pill", txt));
        b.append(slotInfo, el("span", "slot-action", g.chiuso ? "Chiuso" : full ? "Completo" : "Prenota →"));
        if (!g.chiuso && t.liberi === 1) b.classList.add("last");
        if (g.chiuso || full) {
          b.disabled = true;
          b.setAttribute("aria-label", giornoLungo(g.data) + ", " + label + ": " + txt.toLowerCase());
        } else {
          b.setAttribute("aria-label", giornoLungo(g.data) + ", " + label + ": " + txt + ". Prenota");
          b.addEventListener("click", function () { openBook(g, t); });
        }
        day.append(b);
      });
      els.days.append(day);
    });
  }

  function carica() {
    var id = ++reqId;
    call("getDisponibilita").then(function (res) {
      if (id !== reqId) return;
      data = res;
      state = "ready";
      render();
    }).catch(function () {
      if (id !== reqId) return;
      if (state !== "ready") { state = "error"; render(); }
    });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && els.overlay.hidden) carica();
  });

  var previousFocus = null;
  // ---- Finestra ----
  function openSheet(nodes) {
    if (els.overlay.hidden) previousFocus = document.activeElement;
    var close = el("button", "btn sheet-close", "×");
    close.type = "button";
    close.setAttribute("aria-label", "Chiudi finestra");
    close.addEventListener("click", function () { closeSheet(); carica(); });
    els.sheet.replaceChildren.apply(els.sheet, [close].concat(nodes));
    document.querySelector("main").inert = true;
    document.body.style.overflow = "hidden";
    els.overlay.hidden = false;
    els.sheet.scrollTop = 0;
    close.focus();
  }
  function closeSheet() {
    els.overlay.hidden = true;
    els.sheet.replaceChildren();
    document.querySelector("main").inert = false;
    document.body.style.overflow = "";
    if (previousFocus && previousFocus.isConnected) previousFocus.focus();
  }
  els.overlay.addEventListener("click", function (e) { if (e.target === els.overlay) { closeSheet(); carica(); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !els.overlay.hidden) { closeSheet(); carica(); } });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Tab" || els.overlay.hidden) return;
    var list = Array.from(els.sheet.querySelectorAll('button:not(:disabled), input:not([tabindex="-1"]):not(:disabled), textarea:not(:disabled), a[href]'));
    var first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  function field(id, label, opts) {
    var w = el("div", "field");
    var l = el("label");
    l.htmlFor = id;
    l.append(document.createTextNode(label));
    if (opts.optional) l.append(el("span", "opt", " (facoltativo)"));
    var inp = el(opts.area ? "textarea" : "input");
    inp.id = id;
    inp.name = id;
    if (!opts.area) inp.type = opts.type || "text";
    if (opts.required) inp.required = true;
    if (opts.placeholder) inp.placeholder = opts.placeholder;
    if (opts.autocomplete) inp.setAttribute("autocomplete", opts.autocomplete);
    if (opts.max && !opts.area) inp.maxLength = opts.max;
    if (opts.area) { inp.rows = 2; inp.maxLength = opts.max || 300; }
    if (opts.min != null) { inp.min = opts.min; inp.max = opts.maxNum; inp.inputMode = "numeric"; }
    if (opts.value != null) inp.value = opts.value;
    w.append(l, inp);
    return { wrap: w, input: inp };
  }

  function sheetHead(title, giorno, t) {
    var wrap = el("div");
    var h = el("h2", null, title);
    h.id = "sheet-title";
    var sub = el("p", "sheet-sub");
    sub.append(document.createTextNode(giornoLungo(giorno) + " · "));
    sub.append(el("span", "t", t.inizio + "–" + t.fine));
    wrap.append(h, sub);
    return wrap;
  }

  function openBook(g, t) {
    var f = {
      scuola: field("f-scuola", "Scuola", { required: true, max: 100, autocomplete: "organization", placeholder: "es. I.I.S. Nome della scuola" }),
      comune: field("f-comune", "Comune", { optional: true, max: 60 }),
      referente: field("f-referente", "Referente per l'orientamento", { required: true, max: 80, autocomplete: "name", placeholder: "Nome e cognome" }),
      email: field("f-email", "Email", { required: true, type: "email", max: 100, autocomplete: "email" }),
      tel: field("f-tel", "Telefono", { required: true, type: "tel", max: 30, autocomplete: "tel" }),
      pres: field("f-pres", "Persone che presentano", { required: true, type: "number", min: 1, maxNum: 10, value: 1 }),
      ind: field("f-ind", "Indirizzi di studio da presentare", { optional: true, area: true, max: 200 }),
      esig: field("f-esig", "Esigenze", { optional: true, area: true, max: 200, placeholder: "es. proiettore, collegamento, materiale da distribuire" }),
      note: field("f-note", "Note", { optional: true, area: true, max: 300 })
    };
    var trap = el("div", "trap");
    trap.setAttribute("aria-hidden", "true");
    var trapInput = el("input");
    trapInput.type = "text";
    trapInput.id = "f-web";
    trapInput.name = "web";
    trapInput.tabIndex = -1;
    trapInput.setAttribute("autocomplete", "off");
    trap.append(trapInput);

    var consent = el("label", "consent");
    var cb = el("input");
    cb.type = "checkbox";
    cb.id = "f-consenso";
    consent.append(cb, el("span", null, "Acconsento al trattamento dei dati inseriti per organizzare gli incontri di orientamento."));

    var err = el("p", "err");
    err.hidden = true;
    err.setAttribute("role", "alert");
    var cancel = el("button", "btn", "Annulla");
    cancel.type = "button";
    cancel.addEventListener("click", function () { closeSheet(); carica(); });
    var ok = el("button", "btn primary", "Prenota il turno");
    ok.type = "submit";
    var actions = el("div", "actions");
    actions.append(cancel, ok);

    var form = el("form", "form");
    var r1 = el("fieldset", "form-group"); r1.append(el("legend", null, "Istituto"), f.scuola.wrap, f.comune.wrap);
    var r2 = el("div", "row2"); r2.append(f.email.wrap, f.tel.wrap);
    var contacts = el("fieldset", "form-group"); contacts.append(el("legend", null, "Referente"), f.referente.wrap, r2);
    var participation = el("fieldset", "form-group"); participation.append(el("legend", null, "Partecipazione"), f.pres.wrap, f.ind.wrap, f.esig.wrap, f.note.wrap);
    form.append(r1, contacts, participation, trap, consent, err, actions);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      err.hidden = true;
      if (!cb.checked) { err.textContent = "Per prenotare serve il consenso al trattamento dei dati."; err.hidden = false; return; }
      ok.disabled = true;
      ok.textContent = "Prenoto…";
      call("prenota", {
        giorno: g.data, turno: t.n,
        scuola: f.scuola.input.value, comune: f.comune.input.value, referente: f.referente.input.value,
        email: f.email.input.value, telefono: f.tel.input.value, presentatori: f.pres.input.value,
        indirizzi: f.ind.input.value, esigenze: f.esig.input.value, note: f.note.input.value,
        consenso: cb.checked, web: trapInput.value
      }).then(function (res) {
        if (res && res.ok) { showDone(res); carica(); }
        else {
          err.textContent = (res && res.errore) || "Non è stato possibile prenotare.";
          err.hidden = false;
          ok.disabled = false;
          ok.textContent = "Prenota il turno";
          carica();
        }
      }).catch(function () {
        // La risposta non è arrivata: la prenotazione potrebbe essere già registrata. Si controlla prima di segnalare l'errore.
        ok.textContent = "Verifico la prenotazione…";
        var email = f.email.input.value;
        var tenta = function (n) {
          return call("verificaPrenotazione", email).catch(function () {
            if (n > 0) return new Promise(function (r) { setTimeout(r, 3000); }).then(function () { return tenta(n - 1); });
            return null;
          });
        };
        tenta(2).then(function (res) {
          if (res && res.ok) { showDone(res); carica(); return; }
          err.textContent = FAIL + " Se non ricevi l'email di conferma entro qualche minuto, riprova.";
          err.hidden = false;
          ok.disabled = false;
          ok.textContent = "Prenota il turno";
          carica();
        });
      });
    });

    var hint = el("p", "hint", "Presenterai la scuola a turno nelle classi " + classiTesto + ", " + CONFIG.minuti + " minuti per classe. L'ordine ti arriva per email dopo la prenotazione.");
    openSheet([sheetHead("Prenota il turno", g.data, t), hint, form]);
    f.scuola.input.focus();
  }

  function showDone(res) {
    var r = res.riepilogo;
    var facts = el("dl", "facts");
    facts.append(el("dt", null, "Scuola"), el("dd", null, r.scuola));
    facts.append(el("dt", null, "Data"), el("dd", null, giornoLungo(r.giorno)));
    facts.append(el("dt", null, "Turno"), el("dd", null, r.inizio + "–" + r.fine));
    if (CONFIG.indirizzo) {
      var luogo = el("dd");
      var mapLink = el("a", null, "Plesso Spano, " + CONFIG.indirizzo);
      mapLink.href = CONFIG.mappa;
      mapLink.target = "_blank";
      mapLink.rel = "noopener";
      luogo.append(mapLink);
      facts.append(el("dt", null, "Luogo"), luogo);
    }
    facts.append(el("dt", null, "Codice"), el("dd", null, r.id));
    var prog = el("ul", "prog");
    r.programma.forEach(function (p) {
      var li = el("li");
      li.append(el("span", "o", p.ora), el("span", "c", "classe " + p.classe));
      prog.append(li);
    });
    var msg = res.recuperata
      ? "La prenotazione risulta registrata. Riceverai a " + r.email + " l'email di conferma con il link per annullare: se non la trovi, controlla anche lo spam."
      : res.emailInviata
      ? "Ti abbiamo scritto a " + r.email + " con questi dati e il link per annullare, se non potrai partecipare."
      : "La prenotazione è registrata, ma non siamo riusciti a inviarti l'email di conferma. Annota il codice e conserva questa schermata.";
    var close = el("button", "btn primary", "Chiudi");
    close.type = "button";
    close.addEventListener("click", closeSheet);
    var actions = el("div", "actions");
    actions.append(close);
    var h = el("div");
    var h2 = el("h2", null, "Prenotazione confermata");
    h2.id = "sheet-title";
    h.append(h2);
    openSheet([h, facts, el("p", "hint", "Programma: in ogni fascia incontrerai una classe diversa."), prog, el("p", "sheet-sub", msg), actions]);
  }

  // ---- Annullamento dal link ricevuto per email ----
  function showAnnulla() {
    var a = CONFIG.annulla;
    if (!a) return;
    var box = els.annulla;
    box.hidden = false;
    box.replaceChildren();
    if (!a.trovata) {
      box.append(el("h2", null, "Link non valido"), el("p", null, "Il link di annullamento non è corretto. Controlla di averlo copiato per intero dall'email."));
      return;
    }
    if (!a.attiva) {
      box.append(el("h2", null, "Prenotazione già annullata"), el("p", null, "Per la scuola " + a.scuola + " non risulta nessuna prenotazione attiva."));
      return;
    }
    box.append(el("h2", null, "Annulla la prenotazione"));
    box.append(el("p", null, a.scuola + " · " + giornoLungo(a.giorno) + ", turno " + a.inizio + "–" + a.fine));
    if (a.chiusa) {
      box.append(el("p", null, "Non è più possibile annullare online. Scrivi alla scuola."));
      return;
    }
    var err = el("p", "err");
    err.hidden = true;
    err.setAttribute("role", "alert");
    var actions = el("div", "actions");
    function base() {
      actions.replaceChildren();
      var go = el("button", "btn danger", "Annulla la prenotazione");
      go.type = "button";
      go.addEventListener("click", ask);
      actions.append(go);
    }
    function ask() {
      actions.replaceChildren();
      var keep = el("button", "btn", "Tienila");
      keep.type = "button";
      keep.addEventListener("click", base);
      var yes = el("button", "btn danger solid", "Sì, annulla");
      yes.type = "button";
      yes.addEventListener("click", function () {
        yes.disabled = true;
        yes.textContent = "Annullo…";
        call("annullaConToken", a.token).then(function (res) {
          if (res && res.ok) {
            box.replaceChildren(el("h2", null, "Prenotazione annullata"), el("p", null, "Il posto è tornato disponibile per le altre scuole. Se vuoi, puoi sceglierne un altro qui sotto."));
            carica();
          } else {
            err.textContent = (res && res.errore) || FAIL;
            err.hidden = false;
            yes.disabled = false;
            yes.textContent = "Sì, annulla";
          }
        }).catch(function () {
          err.textContent = FAIL;
          err.hidden = false;
          yes.disabled = false;
          yes.textContent = "Sì, annulla";
        });
      });
      actions.append(keep, yes);
    }
    base();
    box.append(err, actions);
  }

  render();
  showAnnulla();
  carica();
}

// Chiamata al foglio senza cookie: evita l'errore di Google con più account collegati.
function api(fn, args) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ fn: fn, args: args || [] }),
    credentials: "omit",
    redirect: "follow"
  }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (o) {
    if (o && o.__errore) throw new Error(o.__errore);
    return o;
  });
}

var tokenAnnulla = "";
try { tokenAnnulla = new URLSearchParams(location.search).get("annulla") || ""; } catch (e) {}
if (CONFIG_SERVER) {
  avvia(CONFIG_SERVER);
} else if (CONFIG_STATICA && !tokenAnnulla) {
  avvia(CONFIG_STATICA);
} else {
  var n0 = document.getElementById("note");
  n0.textContent = "Caricamento in corso…";
  n0.hidden = false;
  api("config", [tokenAnnulla]).then(avvia).catch(function () {
    var n = document.getElementById("note");
    n.textContent = "Non riesco a caricare la pagina. Ricarica tra qualche istante.";
    n.hidden = false;
  });
}
</script>
</body>
